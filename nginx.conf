# nginx config for the frontend CONTAINER (docker-compose service frontend_v2).
# Not to be confused with the bare-metal config used on the offline Windows
# server, which serves the same dist from a path instead of an image.

# Keep-alive pool to FastAPI. Reusing pooled connections instead of opening a
# fresh TCP connection per request is what removed the multi-second "Initial
# connection" stalls seen over the network.
upstream fastapi_backend {
    server fastapi_v2:8001;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Long enough to be reused across the SPA's request fan-out.
    keepalive_timeout 65s;
    keepalive_requests 1000;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Enterprise (DPD) volumes — one backend poll of a large branch takes
    # minutes (one request per device, 10 concurrent). The nginx default
    # proxy_read_timeout of 60s used to cut these mid-poll, the SPA retried, and
    # every retry launched another full DPD poll. Must stay ABOVE the worst poll
    # time and BELOW the SPA's own timeout for these endpoints.
    location /api/enterprise/ {
        proxy_pass http://fastapi_backend/enterprise/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # update_data — long-running, extended timeout
    location /api/update_data {
        proxy_pass http://fastapi_backend/update_data;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Everything else under /api — strip the prefix before FastAPI.
    # `proxy_http_version 1.1` + `Connection ""` is the required combo to
    # actually reuse the upstream keep-alive pool.
    location /api/ {
        proxy_pass http://fastapi_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # The previous build was a PWA and registered a service worker on this
    # origin; browsers that still have it would keep serving the OLD cached app
    # whatever this container returns. This build ships a kill-switch at /sw.js
    # that unregisters it, so these files must never be cached immutably.
    # Matched before the generic static rule below (nginx evaluates regex
    # locations in source order).
    location ~* ^/(sw\.js|workbox-[^/]+\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    # Content-hashed assets can be cached forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
